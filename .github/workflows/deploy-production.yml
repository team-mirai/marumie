name: Deploy Production

on:
  workflow_dispatch:

# デプロイ成功時に release tag を push するため contents: write が必要
permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      # workflow_dispatch は任意の ref を選択できるため、
      # 検証済みの main 以外からの本番デプロイを拒否する
      - name: Verify ref is main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "本番デプロイは main からのみ実行できます (指定: $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # webapp のビルドに prisma migrate deploy が含まれるため、
      # 先に webapp をデプロイして本番DBのスキーマを更新する
      #
      # Root Directory (webapp / admin) は Vercel のプロジェクト設定側で
      # 適用されるため --cwd は指定しない（指定するとパスが二重になる）
      #
      # --build-env MANUAL_DEPLOY=1 が ignoreCommand の条件を満たし、
      # Git 連携によるビルドはスキップしたまま CLI からのデプロイのみ通す
      - name: Deploy webapp
        run: |
          vercel deploy --prod --yes \
            --build-env MANUAL_DEPLOY=1 \
            --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBAPP }}

      - name: Deploy admin
        run: |
          vercel deploy --prod --yes \
            --build-env MANUAL_DEPLOY=1 \
            --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

      # webapp / admin の両方のデプロイが成功したときだけタグを付ける
      # （途中のステップが失敗するとこのステップは実行されない）
      #
      # タグ名は JST の日時から自動生成する。名前順に並べるとデプロイ順になり、
      # 名前だけでいつのデプロイか分かる
      - name: Create release tag
        run: |
          TAG="release-$(TZ=Asia/Tokyo date '+%Y%m%d-%H%M%S')"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Created release tag: $TAG ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
