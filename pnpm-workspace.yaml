packages:
  - 'packages/*'
  - 'admin'
  - 'webapp'

onlyBuiltDependencies:
  - supabase

# 公開から 3 日（4320 分）経っていない版を依存解決に使わない（推移的な依存を含む）。
# renovate.json の minimumReleaseAge と揃えること（ずれると Renovate が作った lockfile 更新を pnpm が拒否しうる）
minimumReleaseAge: 4320
# 2026-11-04 の Next.js セキュリティリリース（16.4.5）は公開直後のため、
# next と @next/* だけ待ち時間の対象外にする。他のパッケージは 3 日のまま。
minimumReleaseAgeExclude:
  - next
  - '@next/*'
